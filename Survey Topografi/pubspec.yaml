name: topo_survey_mesh
description: "Alat Survey Topografi Presisi Multi-Device via BLE Multilaterasi & Barometrik Diferensial"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Sensor & Positioning
  geolocator: ^12.0.0
  flutter_blue_plus: ^1.34.0
  sensors_plus: ^6.0.0
  flutter_compass: ^0.8.0
  
  # State Management & Utilities
  provider: ^6.1.2
  intl: ^0.19.0
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

