name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - topomesh
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nama Tag Rilis (contoh: v1.0.0)'
        required: false
        default: ''
      release_title:
        description: 'Judul Rilis'
        required: false
        default: 'TopoMesh Geodetic Surveyor - Release APK'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compile APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: topomesh
          fetch-depth: 0

      - name: 2. Set Up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Set Up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: 4. Get Dependencies
        working-directory: "Survey Topografi"
        run: flutter pub get

      - name: 5. Run Tests
        working-directory: "Survey Topografi"
        run: flutter test --no-pub

      - name: 6. Build Release APK
        working-directory: "Survey Topografi"
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/TopoMesh-Surveyor-v1.0-Universal.apk
          cd build/app/outputs/flutter-apk/
          sha256sum TopoMesh-Surveyor-v1.0-Universal.apk > SHA256SUMS.txt

      - name: 7. Determine Release Tag
        id: tagger
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${{ github.run_number }}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Automated Release $TAG [skip ci]"
            git push origin "$TAG" || true
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: 8. Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.tag }}
          name: ${{ github.event.inputs.release_title || steps.tagger.outputs.tag }} - TopoMesh Android APK
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 📱 TopoMesh Geodetic Surveyor — APK Otomatis

            ### ✨ Fitur:
            - Trilaterasi & Multilaterasi BLE (min. 3 Handphone)
            - Altimetri Barometrik Diferensial
            - Jaring TIN Delaunay & Kontur Real-Time
            - Waterpass Digital Plumb Level
            - Ekspor CSV, GeoJSON, DXF 3D

            ### 📥 Unduh:
            - `TopoMesh-Surveyor-v1.0-Universal.apk` — Android 5.0+
            - `SHA256SUMS.txt` — Verifikasi integritas file
          files: |
            Survey Topografi/build/app/outputs/flutter-apk/TopoMesh-Surveyor-v1.0-Universal.apk
            Survey Topografi/build/app/outputs/flutter-apk/SHA256SUMS.txt
